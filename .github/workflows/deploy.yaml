name: EKS + ArgoCD

on:
  pull_request:
    paths: ["terraform/**", "argocd/**"]
  push:
    branches: [main]
    paths: ["terraform/**", "argocd/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write   # needed for AWS OIDC login
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: variables
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks-argocd/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event.inputs.action != 'destroy'
        run: terraform plan -var="region=${{ vars.AWS_REGION }}" -input=false

      # Merge to main (or manual "apply") creates the cluster and installs ArgoCD.
      - name: Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -var="region=${{ vars.AWS_REGION }}" -input=false

      # Register the app with ArgoCD; ArgoCD then deploys it from Git.
      - name: Deploy app through ArgoCD
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.action == 'apply'
        working-directory: .
        run: |
          aws eks update-kubeconfig --name demo-eks --region "${{ vars.AWS_REGION }}"
          sed "s|REPO_URL_PLACEHOLDER|https://github.com/${{ github.repository }}.git|" argocd/app.yaml | kubectl apply -f -
          kubectl -n argocd get applications

      # Delete the ArgoCD app first so its load balancers/volumes are cleaned up.
      - name: Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          aws eks update-kubeconfig --name demo-eks --region "${{ vars.AWS_REGION }}" || true
          kubectl delete application my-app -n argocd --ignore-not-found || true
          terraform destroy -auto-approve -var="region=${{ vars.AWS_REGION }}" -input=false
